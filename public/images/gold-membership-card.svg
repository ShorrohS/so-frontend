<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3528"/>
      <stop offset="40%" stop-color="#1B1C19"/>
      <stop offset="100%" stop-color="#0E100D"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E096"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7B1C"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#56624B" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="790" height="490" x="5" y="5" rx="28" fill="url(#goldBg)" stroke="url(#goldAccent)" stroke-width="2.5" filter="url(#shadow)"/>

  <!-- Decorative Outer Line -->
  <rect width="740" height="440" x="30" y="30" rx="20" fill="none" stroke="url(#goldAccent)" stroke-width="1" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Geometric Watermark Rings -->
  <circle cx="680" cy="100" r="180" fill="none" stroke="url(#goldAccent)" stroke-width="0.75" opacity="0.15"/>
  <circle cx="680" cy="100" r="130" fill="none" stroke="url(#goldAccent)" stroke-width="0.75" opacity="0.25"/>

  <!-- Botanical Emblem -->
  <g transform="translate(70, 70)">
    <circle cx="35" cy="35" r="32" fill="none" stroke="url(#goldAccent)" stroke-width="1.5"/>
    <path d="M35 10 C35 10, 22 25, 22 36 C22 47, 35 58, 35 58 C35 58, 48 47, 48 36 C48 25, 35 10, 35 10 Z" fill="url(#leafGrad)" stroke="url(#goldAccent)" stroke-width="1.5"/>
    <line x1="35" y1="10" x2="35" y2="58" stroke="url(#goldAccent)" stroke-width="1.2"/>
  </g>

  <!-- Card Title -->
  <text x="160" y="100" font-family="'Libre Caslon Text', serif" font-size="28" fill="#F9F7F2" letter-spacing="4">SALON ORGÆNICS</text>
  <text x="160" y="125" font-family="'Manrope', sans-serif" font-size="12" font-weight="600" fill="#D4AF37" letter-spacing="6">EXCLUSIVE SANCTUARY</text>

  <!-- Gold Membership Chip / Badge -->
  <rect x="70" y="210" width="70" height="50" rx="8" fill="url(#goldAccent)" opacity="0.9"/>
  <line x1="70" y1="235" x2="140" y2="235" stroke="#1B1C19" stroke-width="1" opacity="0.5"/>
  <line x1="105" y1="210" x2="105" y2="260" stroke="#1B1C19" stroke-width="1" opacity="0.5"/>

  <!-- Card Tier Header -->
  <text x="70" y="320" font-family="'Libre Caslon Text', serif" font-size="36" fill="url(#goldAccent)" letter-spacing="3">GOLD MEMBER</text>
  <text x="70" y="350" font-family="'Manrope', sans-serif" font-size="14" fill="#C5C8BD" letter-spacing="2">VIP BOTANICAL PRIVILEGES</text>

  <!-- Card Details / Number -->
  <text x="70" y="425" font-family="'Manrope', sans-serif" font-size="18" fill="#F9F7F2" letter-spacing="5">••••  ••••  8824  9901</text>
  <text x="620" y="425" font-family="'Manrope', sans-serif" font-size="14" fill="#D4AF37" letter-spacing="2">MEMBER SINCE 2026</text>
</svg>
