name: Frontend Build & Deploy to AWS S3/CloudFront

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Sync Web Assets to S3 / CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Static App Assets
        run: npm run build || echo "No custom build step defined yet. Proceeding with static upload."

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Sync Static Assets to S3 Bucket
        env:
          S3_BUCKET: ${{ secrets.FRONTEND_S3_BUCKET || 'so-frontend-assets' }}
        run: |
          TARGET_DIR="dist"
          if [ ! -d "$TARGET_DIR" ]; then TARGET_DIR="build"; fi
          if [ ! -d "$TARGET_DIR" ]; then TARGET_DIR="."; fi
          echo "Syncing $TARGET_DIR to s3://$S3_BUCKET..."
          aws s3 sync $TARGET_DIR s3://$S3_BUCKET --delete --exclude ".git*" --exclude ".github*"

      - name: Invalidate CloudFront Distribution Cache
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            echo "Invalidating CloudFront Cache for Distribution $CLOUDFRONT_DISTRIBUTION_ID..."
            aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
          else
            echo "CLOUDFRONT_DISTRIBUTION_ID secret not configured yet."
          fi
